services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jk-receipt-app
    restart: always
    ports:
      - "3011:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://jejaku:jejaku_password@db:5432/jejaku_db
      - OLLAMA_HOST=${OLLAMA_HOST:-http://172.17.0.1:11434}
      - LOCAL_VISION_MODEL=${LOCAL_VISION_MODEL:-moondream:latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /home/muddassir/.local:/home/muddassir/.local:ro
      - /usr/local/lib:/usr/local/lib:ro
      - /usr/lib/python3/dist-packages:/usr/lib/python3/dist-packages:ro
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: jk-receipt-db
    restart: always
    environment:
      POSTGRES_USER: jejaku
      POSTGRES_PASSWORD: jejaku_password
      POSTGRES_DB: jejaku_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
