services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jk-receipt-app
    restart: always
    ports:
      - "3011:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - DATABASE_URL=postgres://jejaku:jejaku_password@db:5432/jejaku_db
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - LOCAL_VISION_MODEL=${LOCAL_VISION_MODEL:-llava:7b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: jk-receipt-db
    restart: always
    environment:
      POSTGRES_USER: jejaku
      POSTGRES_PASSWORD: jejaku_password
      POSTGRES_DB: jejaku_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
